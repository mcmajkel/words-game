<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polish Letter & Category Guessing Game</title>
    <style>
        :root {
            --bg-primary: white;
            --bg-secondary: #f8f9fa;
            --text-primary: #333;
            --text-secondary: #666;
            --border-color: #ddd;
            --primary-color: #667eea;
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
            --shadow: rgba(0, 0, 0, 0.3);
            --hover-bg: #f0f4ff;
        }

        body.dark-mode {
            --bg-primary: #1e1e1e;
            --bg-secondary: #2d2d2d;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-color: #404040;
            --primary-color: #7c8dff;
            --gradient-start: #5568d3;
            --gradient-end: #6a3a7a;
            --shadow: rgba(0, 0, 0, 0.7);
            --hover-bg: #3d3d4d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .container {
            background: var(--bg-primary);
            border-radius: 20px;
            box-shadow: 0 10px 40px var(--shadow);
            padding: 30px;
            max-width: 900px;
            width: 100%;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        h1 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 2em;
            transition: color 0.3s ease;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 1.1em;
            transition: color 0.3s ease;
        }

        .game-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .section {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 15px;
            transition: background 0.3s ease;
        }

        .section h2 {
            color: var(--primary-color);
            margin-bottom: 15px;
            font-size: 1.3em;
            transition: color 0.3s ease;
        }

        /* Drawing Section */
        canvas {
            border: 3px solid var(--primary-color);
            border-radius: 10px;
            background: var(--bg-primary);
            display: block;
            margin-bottom: 15px;
            cursor: crosshair;
            touch-action: none;
            transition: background 0.3s ease;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clear-btn {
            background: #ff6b6b;
            color: white;
        }

        .clear-btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .submit-btn {
            background: #51cf66;
            color: white;
            font-size: 1.1em;
        }

        .submit-btn:hover {
            background: #40c057;
            transform: scale(1.05);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* Category Selection */
        .category-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .category-btn {
            padding: 15px;
            border: 3px solid #ddd;
            background: white;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .category-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .category-btn.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .category-icon {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .category-name {
            font-size: 0.95em;
        }

        /* Display Section */
        .display-section {
            grid-column: 1 / -1;
            text-align: center;
        }

        .display-section h2 {
            margin-bottom: 20px;
        }

        .game-status {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .status-box {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid var(--primary-color);
            transition: all 0.3s ease;
        }

        .status-label {
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-bottom: 5px;
            transition: color 0.3s ease;
        }

        .status-value {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary-color);
            transition: color 0.3s ease;
        }

        .words-list {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            margin-bottom: 20px;
            min-height: 100px;
            transition: all 0.3s ease;
        }

        .words-title {
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-bottom: 10px;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .word-item {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            margin: 5px;
            font-size: 1.1em;
            transition: background 0.3s ease;
        }

        .empty-message {
            color: #999;
            font-style: italic;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .game-layout {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .category-buttons {
                grid-template-columns: 1fr 1fr;
            }

            h1 {
                font-size: 1.5em;
            }

            canvas {
                max-height: 300px;
            }
        }

        .celebration {
            font-size: 2em;
            animation: bounce 0.6s;
            margin: 10px 0;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* Input Section */
        .input-section {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid var(--primary-color);
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        #answerInput {
            flex: 1;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1.1em;
            font-family: 'Arial', sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        #answerInput:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .check-btn {
            background: var(--primary-color);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .check-btn:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .hint-btn {
            background: #ffa94d;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .hint-btn:hover {
            background: #ff922b;
            transform: scale(1.05);
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            text-align: center;
            display: none;
            transition: all 0.3s ease;
        }

        .feedback.success {
            background: #d3f9d8;
            color: #2f9e44;
            border: 2px solid #2f9e44;
            display: block;
        }

        body.dark-mode .feedback.success {
            background: #1e4620;
            color: #90ee90;
            border-color: #90ee90;
        }

        .feedback.error {
            background: #ffe0e0;
            color: #c92a2a;
            border: 2px solid #c92a2a;
            display: block;
        }

        body.dark-mode .feedback.error {
            background: #3d1a1a;
            color: #ff6b6b;
            border-color: #ff6b6b;
        }

        .hints-display {
            margin-top: 15px;
            padding: 15px;
            background: #fff3bf;
            border: 2px solid #ffa94d;
            border-radius: 8px;
            display: none;
            transition: all 0.3s ease;
        }

        body.dark-mode .hints-display {
            background: #3d2d0a;
            border-color: #ff8c00;
        }

        .hints-display.show {
            display: block;
        }

        .hints-display h3 {
            color: #d9480f;
            margin-bottom: 10px;
        }

        body.dark-mode .hints-display h3 {
            color: #ffa500;
        }

        .hint-item {
            display: inline-block;
            background: white;
            border: 2px solid #ffa94d;
            color: #d9480f;
            padding: 8px 12px;
            border-radius: 20px;
            margin: 5px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        body.dark-mode .hint-item {
            background: #2d2d2d;
            border-color: #ff8c00;
            color: #ffa500;
        }

        /* Categories Pane */
        .categories-pane {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid var(--primary-color);
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .categories-toggle-btn {
            background: var(--primary-color);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .categories-toggle-btn:hover {
            background: #5568d3;
            transform: scale(1.02);
        }

        .categories-toggle-btn.collapsed {
            margin-bottom: 0;
        }

        .categories-content {
            max-height: 500px;
            overflow: hidden;
            transition: max-height 0.3s ease;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .categories-content.collapsed {
            max-height: 0;
            display: none;
        }

        .category-checkbox {
            display: flex;
            align-items: center;
            padding: 12px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-primary);
        }

        .category-checkbox:hover {
            border-color: var(--primary-color);
            background: var(--hover-bg);
        }

        .category-checkbox.selected {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        .category-checkbox input[type="checkbox"] {
            margin-right: 10px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .category-checkbox label {
            cursor: pointer;
            margin: 0;
            flex: 1;
            font-weight: bold;
        }

        /* Dark Mode Toggle Button */
        .dark-mode-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-secondary);
            border: 2px solid var(--primary-color);
            color: var(--text-primary);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .dark-mode-toggle:hover {
            transform: scale(1.1);
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <button class="dark-mode-toggle" onclick="toggleDarkMode()" title="Toggle dark mode">🌙</button>

    <div class="container">
        <h1>🎲 Gra w Zgadywanie Słów 🎮</h1>
        <p class="subtitle">Wybierz kategorie, naciśnij przycisk i odgadnij słowo!</p>

        <!-- Categories Pane -->
        <div class="categories-pane">
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button class="categories-toggle-btn" onclick="toggleCategories()" style="flex: 1;">
                    <span>📂 Kategorie do losowania</span>
                    <span id="toggleIcon">▼</span>
                </button>
                <button class="submit-btn" onclick="selectAllCategories()" style="padding: 15px 20px; font-size: 1em;">
                    ✓ Wszystkie
                </button>
            </div>
            <div class="categories-content" id="categoriesContent">
                <label class="category-checkbox category-selected" onclick="toggleCategory('owoce', event)">
                    <input type="checkbox" checked id="cat-owoce">
                    <label for="cat-owoce">🍎 Owoce</label>
                </label>
                <label class="category-checkbox category-selected" onclick="toggleCategory('warzywa', event)">
                    <input type="checkbox" checked id="cat-warzywa">
                    <label for="cat-warzywa">🥕 Warzywa</label>
                </label>
                <label class="category-checkbox category-selected" onclick="toggleCategory('zwierzeta', event)">
                    <input type="checkbox" checked id="cat-zwierzeta">
                    <label for="cat-zwierzeta">🦁 Zwierzęta</label>
                </label>
                <label class="category-checkbox category-selected" onclick="toggleCategory('auta', event)">
                    <input type="checkbox" checked id="cat-auta">
                    <label for="cat-auta">🚗 Auta</label>
                </label>
                <label class="category-checkbox category-selected" onclick="toggleCategory('kolory', event)">
                    <input type="checkbox" checked id="cat-kolory">
                    <label for="cat-kolory">🎨 Kolory</label>
                </label>
                <label class="category-checkbox category-selected" onclick="toggleCategory('dom', event)">
                    <input type="checkbox" checked id="cat-dom">
                    <label for="cat-dom">🏠 Dom</label>
                </label>
                <label class="category-checkbox category-selected" onclick="toggleCategory('ubior', event)">
                    <input type="checkbox" checked id="cat-ubior">
                    <label for="cat-ubior">👕 Ubiór</label>
                </label>
                <label class="category-checkbox category-selected" onclick="toggleCategory('sport', event)">
                    <input type="checkbox" checked id="cat-sport">
                    <label for="cat-sport">⚽ Sport</label>
                </label>
            </div>
        </div>

        <div class="game-layout">
            <!-- Random Button Section -->
            <div class="section" style="grid-column: 1 / -1; text-align: center;">
                <button class="submit-btn" onclick="randomizeAll()" style="width: 100%; font-size: 1.5em; padding: 30px; margin-bottom: 20px;">
                    🎲 WYLOSUJ LITERĘ I KATEGORIĘ!
                </button>
            </div>

            <!-- Display Section -->
            <div class="display-section" style="grid-column: 1 / -1;">
                <h2>🎯 Wynik</h2>
                <div class="game-status">
                    <div class="status-box">
                        <div class="status-label">Wylosowana Litera:</div>
                        <div class="status-value" id="recognizedLetter" style="font-size: 3em;">?</div>
                    </div>
                    <div class="status-box">
                        <div class="status-label">Wylosowana Kategoria:</div>
                        <div class="status-value" id="selectedCategory" style="font-size: 1.5em;">-</div>
                    </div>
                </div>
                <button class="hint-btn" onclick="toggleWordsList()" style="width: 100%; margin-bottom: 15px;">
                    👀 Pokaż / Ukryj Słowa
                </button>
                <div class="words-list" id="wordsListContainer" style="display: none;">
                    <div class="words-title">Słowa w wylosowanej kategorii:</div>
                    <div id="wordsList" class="empty-message">Naciśnij przycisk aby wylosować!</div>
                </div>

                <!-- Input Section -->
                <div class="input-section">
                    <div class="input-group">
                        <input
                            type="text"
                            id="answerInput"
                            placeholder="Wpisz odpowiedź..."
                            onkeypress="handleEnter(event)"
                        />
                        <button class="check-btn" onclick="checkAnswer()">✓ Sprawdź</button>
                        <button class="hint-btn" onclick="showHints()">💡 Podpowiedź</button>
                    </div>
                    <div id="feedback" class="feedback"></div>
                    <div id="hintsDisplay" class="hints-display">
                        <h3>💡 Podpowiedzi:</h3>
                        <div id="hintsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Comprehensive Polish word database with 2500+ words (automated)

        let currentLetter = null;
        let selectedCategory = null;
        let isCategoriesPaneOpen = true;
        const allLetters = 'AĄBCĆDEĘFGHIJKLŁMNŃOÓPRSTŚTUVWXYZŹŻ'.split('');
        const allCategories = ['owoce', 'warzywa', 'zwierzeta', 'auta', 'kolory', 'dom', 'ubior', 'sport'];
        let activeCategories = new Set(allCategories); // Track selected categories
        const categoryNames = {
            owoce: '🍎 Owoce',
            warzywa: '🥕 Warzywa',
            zwierzeta: '🦁 Zwierzęta',
            auta: '🚗 Auta',
            kolory: '🎨 Kolory',
            dom: '🏠 Dom',
            ubior: '👕 Ubiór',
            sport: '⚽ Sport'

        // Initialize dark mode from localStorage
        function initDarkMode() {
            const savedDarkMode = localStorage.getItem('darkMode') === 'true';
            if (savedDarkMode) {
                document.body.classList.add('dark-mode');
                updateDarkModeButton();
            }
        }

        // Toggle dark mode
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDarkMode = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDarkMode);
            updateDarkModeButton();
        }

        // Update button emoji based on mode
        function updateDarkModeButton() {
            const button = document.querySelector('.dark-mode-toggle');
            const isDarkMode = document.body.classList.contains('dark-mode');
            button.textContent = isDarkMode ? '☀️' : '🌙';
        }

        // Initialize dark mode on page load
        window.addEventListener('DOMContentLoaded', initDarkMode);

        function toggleCategories() {
            isCategoriesPaneOpen = !isCategoriesPaneOpen;
            const content = document.getElementById('categoriesContent');
            const icon = document.getElementById('toggleIcon');

            if (isCategoriesPaneOpen) {
                content.classList.remove('collapsed');
                icon.textContent = '▼';
                document.querySelector('.categories-toggle-btn').classList.remove('collapsed');
            } else {
                content.classList.add('collapsed');
                icon.textContent = '▶';
                document.querySelector('.categories-toggle-btn').classList.add('collapsed');
            }
        }

        function toggleCategory(category, event) {
            event.stopPropagation();
            const checkbox = document.getElementById(`cat-${category}`);
            const label = event.currentTarget;

            if (activeCategories.has(category)) {
                activeCategories.delete(category);
                checkbox.checked = false;
                label.classList.remove('selected');
            } else {
                activeCategories.add(category);
                checkbox.checked = true;
                label.classList.add('selected');
            }
        }

        function selectAllCategories() {
            // If all are selected, deselect all. Otherwise select all.
            const allSelected = activeCategories.size === allCategories.length;

            activeCategories.clear();

            allCategories.forEach(category => {
                const checkbox = document.getElementById(`cat-${category}`);
                const label = checkbox.closest('.category-checkbox');

                if (!allSelected) {
                    // Select all
                    activeCategories.add(category);
                    if (checkbox) checkbox.checked = true;
                    if (label) label.classList.add('selected');
                } else {
                    // Deselect all
                    if (checkbox) checkbox.checked = false;
                    if (label) label.classList.remove('selected');
                }
            });
        }

        function randomizeAll() {
            // Check if at least one category is selected
            if (activeCategories.size === 0) {
                alert('Proszę wybrać przynajmniej jedną kategorię!');
                return;
            }

            let hasWords = false;
            let attempts = 0;
            const maxAttempts = 30;
            const activeCategoriesArray = Array.from(activeCategories);

            // Keep trying until we find a letter/category combo with words
            while (!hasWords && attempts < maxAttempts) {
                // Randomize letter
                currentLetter = allLetters[Math.floor(Math.random() * allLetters.length)];

                // Randomize category from ACTIVE categories only
                selectedCategory = activeCategoriesArray[Math.floor(Math.random() * activeCategoriesArray.length)];

                // Check if this combination has words
                const words = wordsDatabase[selectedCategory][currentLetter] || [];
                hasWords = words.length > 0;

                attempts++;
            }

            document.getElementById('recognizedLetter').textContent = currentLetter;
            document.getElementById('selectedCategory').textContent = categoryNames[selectedCategory];

            // Update category button highlights
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('selected');
            });

            // Clear input and feedback
            document.getElementById('answerInput').value = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('feedback').textContent = '';
            document.getElementById('hintsDisplay').classList.remove('show');
            document.getElementById('hintsList').innerHTML = '';

            // Hide words list on new round
            document.getElementById('wordsListContainer').style.display = 'none';

            // Display results
            updateWordsDisplay();

            // Focus on input
            document.getElementById('answerInput').focus();
        }

        function toggleWordsList() {
            const container = document.getElementById('wordsListContainer');
            if (container.style.display === 'none') {
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
            }
        }

        function updateWordsDisplay() {
            if (!selectedCategory) {
                document.getElementById('wordsList').innerHTML = '<div class="empty-message">Wybierz kategorię</div>';
                return;
            }

            if (!currentLetter) {
                document.getElementById('wordsList').innerHTML = '<div class="empty-message">Wylosuj literę</div>';
                return;
            }

            const words = wordsDatabase[selectedCategory][currentLetter] || [];

            let html = '';
            if (words.length > 0) {
                html = words.map(word => `<span class="word-item">${word}</span>`).join('');
                html += '<div class="celebration">✨🎉✨</div>';
            } else {
                html = '<span class="empty-message">Brak słów zaczynających się na tę literę w tej kategorii 🤔</span>';
            }

            document.getElementById('wordsList').innerHTML = html;
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                checkAnswer();
            }
        }

        function checkAnswer() {
            const userAnswer = document.getElementById('answerInput').value.trim();
            const feedbackElement = document.getElementById('feedback');

            if (!userAnswer) {
                feedbackElement.textContent = 'Proszę wpisać odpowiedź!';
                feedbackElement.className = 'feedback error';
                return;
            }

            if (!currentLetter || !selectedCategory) {
                feedbackElement.textContent = 'Najpierw wylosuj literę i kategorię!';
                feedbackElement.className = 'feedback error';
                return;
            }

            // Check if answer starts with correct letter (case-insensitive)
            const firstLetter = userAnswer.charAt(0).toUpperCase();
            if (firstLetter !== currentLetter) {
                feedbackElement.textContent = `❌ Słowo musi zaczynać się na literę "${currentLetter}"`;
                feedbackElement.className = 'feedback error';
                return;
            }

            // Check if answer exists in the database for this category
            const words = wordsDatabase[selectedCategory][currentLetter] || [];
            const isExact = words.some(w => w.toLowerCase() === userAnswer.toLowerCase());

            if (isExact) {
                feedbackElement.textContent = `🎉 Brawo! "${userAnswer}" jest poprawną odpowiedzią!`;
                feedbackElement.className = 'feedback success';
                document.getElementById('answerInput').value = '';
                setTimeout(() => {
                    randomizeAll();
                }, 2000);
            } else {
                // Check if at least it's a valid word in the category
                feedbackElement.textContent = `⚠️ "${userAnswer}" nie jest na liście. Spróbuj inny wyraz zaczynający się na "${currentLetter}"`;
                feedbackElement.className = 'feedback error';
            }
        }

        function showHints() {
            if (!currentLetter || !selectedCategory) {
                alert('Najpierw wylosuj literę i kategorię!');
                return;
            }

            const words = wordsDatabase[selectedCategory][currentLetter] || [];

            if (words.length === 0) {
                document.getElementById('hintsDisplay').classList.remove('show');
                alert('Brak słów do podpowiadania!');
                return;
            }

            const hintsDisplay = document.getElementById('hintsDisplay');
            const hintsList = document.getElementById('hintsList');

            // Show the hints
            hintsList.innerHTML = words
                .map(word => `<span class="hint-item">${word}</span>`)
                .join('');

            hintsDisplay.classList.add('show');
        }
